<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--SEO--><title>Vivid Brandify | WhatsApp, Voice Call &amp; AI Video Marketing Agency</title>
<meta name="description" content="Vivid Brandify runs WhatsApp marketing, voice call campaigns, WhatsApp marketing software, AI video creation and complete digital marketing for growing businesses.">
<meta property="og:title" content="Vivid Brandify | WhatsApp, Voice Call &amp; AI Video Marketing Agency"><!--/SEO-->
<link rel="icon" type="image/png" href="/assets/brand/favicon.png">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<meta name="theme-color" content="#24100F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<script>document.documentElement.classList.add("vb-boot")</script>
<!--THEME-->
<!--HEAD_CODE-->
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="offer-bar" id="offerBar" hidden></div>
<header class="site-head">
  <div class="wrap head-row">
    <a class="logo" href="/" id="logo"></a>
    <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
    <nav class="nav" id="nav" aria-label="Main"></nav>
  </div>
</header>

<main id="main">
  <div id="homeView">
    <section class="hero" aria-roledescription="carousel" aria-label="Highlights">
      <div class="wrap">
        <div class="slides" id="slides"></div>
        <div class="hero-note" id="heroNote"></div>
        <div class="hero-foot" id="heroFoot">
          <div class="dots" id="dots" role="tablist" aria-label="Choose slide"></div>
          <div class="arrows">
            <span class="count" id="heroCount" aria-live="polite"></span>
            <button class="arrow" id="prev" aria-label="Previous slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
            <button class="arrow" id="next" aria-label="Next slide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
          </div>
        </div>
      </div>
    </section>

    <div class="wrap" id="sections">
      <section class="offers-strip" id="offers" hidden></section>
      <div data-section="stats" class="stats-wrap"><div class="stats" id="stats"></div></div>

      <section class="block" id="services" data-section="services">
        <div class="sec-head"></div>
        <div class="svc-grid" id="svcGrid"></div>
      </section>

      <section class="block bz-spot-wrap" id="bizcrt" data-section="bizcrt" aria-label="BizCRT">
        <div id="bizSpot"></div>
      </section>

      <section class="block" id="store" data-section="store">
        <div class="sec-head"></div>
        <div class="prod-grid" id="prodGrid"></div>
      </section>

      <section class="block" id="work" data-section="work">
        <div class="sec-head"></div>
        <div class="work-grid" id="workGrid"></div>
      </section>

      <section class="block" id="process" data-section="process">
        <div class="sec-head"></div>
        <div class="steps" id="steps"></div>
      </section>

      <section class="block" id="reviews" data-section="reviews">
        <div class="sec-head"></div>
        <div class="quotes" id="quotes" tabindex="0" aria-label="Reviews, scroll sideways"></div>
        <div class="row-ctrl"><button id="qPrev" aria-label="Previous review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><button id="qNext" aria-label="Next review"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
      </section>

      <section class="block" id="blog" data-section="blog">
        <div class="sec-head"></div>
        <div class="posts" id="posts"></div>
      </section>

      <section class="block" id="faq" data-section="faq">
        <div class="sec-head"></div>
        <div class="faq" id="faqList"></div>
      </section>

      <section class="contact" id="contact" data-section="contact">
        <div class="contact-copy">
          <div class="eyebrow" id="ctEyebrow"></div>
          <h2 id="ctHeading"></h2>
          <p id="ctText"></p>
          <div class="contact-lines" id="ctLines"></div>
        </div>
        <form class="form" id="leadForm" novalidate>
          <div class="two">
            <label for="fName">Your name<input id="fName" name="name" type="text" autocomplete="name" required></label>
            <label for="fPhone">Phone / WhatsApp<input id="fPhone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
          </div>
          <div class="two">
            <label for="fSvc">What do you need?<select id="fSvc" name="service"></select></label>
            <label for="fCall"><span>Best time to call <small>optional</small></span><select id="fCall" name="callback"><option value="">Any time</option><option>As soon as possible</option><option>Morning (10 am – 1 pm)</option><option>Afternoon (1 – 5 pm)</option><option>Evening (5 – 8 pm)</option></select></label>
          </div>
          <div class="two">
            <label for="fBiz"><span>Business name <small>optional</small></span><input id="fBiz" name="business" type="text" autocomplete="organization"></label>
            <label for="fType"><span>Business category <small>optional</small></span><select id="fType" name="business_type"></select></label>
          </div>
          <div class="two">
            <label for="fCity"><span>City <small>optional</small></span><input id="fCity" name="city" type="text" autocomplete="address-level2"></label>
            <label for="fEmail"><span>Email <small>optional</small></span><input id="fEmail" name="email" type="email" autocomplete="email"></label>
          </div>
          <label for="fMsg"><span>Tell us a little more <small>optional</small></span><textarea id="fMsg" name="message" rows="3" placeholder="e.g. I run a clinic and want appointment reminders on WhatsApp"></textarea></label>
          <label class="optin" for="fOptin"><input type="checkbox" id="fOptin" name="opt_in" value="yes"> Send me offers and reminders on WhatsApp</label>
          <label class="hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
          <div><button class="btn btn-accent" type="submit" id="fSubmit">Send my enquiry</button></div>
          <div class="form-out" id="formOut" aria-live="polite"></div>
        </form>
      </section>
    </div>
  </div>

  <div id="offerView" hidden></div>
  <div id="productView" hidden></div>
  <div id="bizView" hidden></div>
  <div id="articleView" hidden><div class="wrap"><article class="article" id="article"></article></div></div>
  <!--NOSCRIPT-->
  <div class="wrap"><footer class="foot" id="foot"></footer></div>
</main>

<div id="waWidget"></div>

<!--DATA-->
<script src="/assets/config.js"></script>
<script src="/assets/content.js"></script>
<script src="/assets/site.js" defer></script>
<!--BODY_END-->
</body>
</html>
